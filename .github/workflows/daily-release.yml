name: Nightly/Beta/Release Pipeline (04:00 UTC+8)

# 每天北京时间 04:00 自动发 nightly（patch +0.0.1）；满十个 nightly 自动进位为 beta（0.6.9 → 0.7.0）。
# nightly 禁止手动触发；手动触发仅允许 beta（minor +0.1.0）与 stable（major +1.0.0）。
# 版本号提交 main，tag 与 GitHub Release 由 tauri-action 自动创建，零人工。
#
# 注意：本工作流固定使用 actions/checkout@v5 与 actions/setup-node@v5（均运行于 node24 运行时）。
# 设计如此——v4 运行于已被 GitHub 弃用的 node20，会触发两条无害但扰人的 WARN：
#   1) "Node.js 20 is deprecated"（runner 强制以 node24 运行 v4 action）
#   2) setup-node@v4 解析 lts/* 别名时其内部 require 了已弃用的内置 punycode 模块（DEP0040）
# 升级到 v5 即可一并消除，无需改动业务逻辑。
on:
  schedule:
    # 北京时间 04:00 = UTC 前一天 20:00
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "发布渠道（nightly 临时开放手动触发，验证后回滚）"
        type: choice
        default: beta
        options:
          - nightly
          - beta
          - stable

permissions:
  contents: write # 需要推送版本提交与 tag

jobs:
  # 单跑一次：算版本号 + 改文件 + 提交 + 推送到 main（不推 tag，避免重复触发 release.yml）
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
      channel: ${{ steps.ver.outputs.channel }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      # 版本 bump 提交的 SHA：build 必须显式 checkout 这个 commit，
      # 否则定时触发时 checkout 会落在触发时刻的旧 HEAD（版本尚未 bump），
      # 导致 tag 用新版本号、编译产物用旧版本号，恒差 0.0.1
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Suppress git defaultBranch hint
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Determine next version (auto nightly / manual beta+stable)
        id: ver
        run: |
          INPUT="${{ github.event.inputs.channel || '' }}"
          BASE=$(node -p "require('./package.json').version")
          if [[ -n "$INPUT" ]]; then
            # 临时开放 nightly 手动触发，用于验证 tag 与产物版本号一致性（验证后回滚）
            CHANNEL="$INPUT"
            VERSION=$(node scripts/next-version.mjs "$CHANNEL" "$BASE")
          else
            # 定时自动：nightly patch +0.0.1；满十个（base patch=9 进位 X.Y.0）自动转为 beta
            VERSION=$(node scripts/next-version.mjs nightly "$BASE")
            if [[ "$VERSION" =~ \.0$ && "$BASE" =~ \.9$ ]]; then
              CHANNEL="beta"
            else
              CHANNEL="nightly"
            fi
          fi
          # nightly/beta 为预发布，stable 为正式版
          if [[ "$CHANNEL" == "stable" ]]; then PRERELEASE=false; else PRERELEASE=true; fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Channel: ${CHANNEL}, Next version: ${VERSION}, Prerelease: ${PRERELEASE}"

      - name: Bump version in package.json / tauri.conf.json / Cargo.toml
        run: |
          npm version "$VERSION" --no-git-tag-version
          node scripts/sync-version.mjs
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Commit & push version bump to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore(release): v$VERSION [$CHANNEL] [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}

  # 多平台打包，依赖 prepare 算出的版本号
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Suppress git defaultBranch hint
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 显式 checkout prepare 刚 push 的版本 bump commit，
          # 保证 tauri.conf.json / Cargo.toml 的版本号与 tag 一致
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish (creates tag + GitHub Release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: 'WorkMami ${{ needs.prepare.outputs.version }}'
          releaseBody: |
            **Channel**: ${{ needs.prepare.outputs.channel }}
            **Version**: ${{ needs.prepare.outputs.version }}
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          args: --target ${{ matrix.target }}

  # 把 main 分支 + 新 tag 同步镜像到 Gitee
  # 前置条件：在 GitHub 仓库 Secrets 中配置
  #   GITEE_USERNAME  -> 你的 Gitee 登录名
  #   GITEE_TOKEN     -> Gitee 私人令牌（需 projects 权限）
  mirror:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Suppress git defaultBranch hint
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch version commit + tag from GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin

      - name: Push main and tags to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过 Gitee 镜像"
            exit 0
          fi
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/lichangboicq/WorkMami.git" \
            || git remote set-url gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/lichangboicq/WorkMami.git"
          git push gitee HEAD:main --tags
