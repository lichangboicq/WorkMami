name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - nightly

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      # fetch-depth: 0 保证能拉到全部 tag，nightly 自增计数依赖 tag 历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Determine version and channel
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # tag push: stable / beta / nightly（tag 名即版本号）
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ "${VERSION}" == *"-beta."* ]]; then
              CHANNEL="beta"
            elif [[ "${VERSION}" == *"-nightly."* ]]; then
              CHANNEL="nightly"
            else
              CHANNEL="stable"
            fi
          else
            # nightly branch push: 自动递增计数
            # 版本形如 <package.json 版本>-nightly.N，N = 已有 nightly tag 最大值 + 1
            BASE=$(node -p "require('./package.json').version")
            LAST=$(git tag -l 'v*-nightly.*' | sed -E 's/.*-nightly\.([0-9]+)$/\1/' | sort -n | tail -1)
            N=$(( ${LAST:-0} + 1 ))
            VERSION="${BASE}-nightly.${N}"
            TAG_NAME="v${VERSION}"
            CHANNEL="nightly"
          fi
          # 含预发布分隔符 "-" 的一律标记为 prerelease
          if [[ "${VERSION}" == *"-"* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Channel: ${CHANNEL}, Version: ${VERSION}, Prerelease: ${PRERELEASE}"

      - name: Update version in package.json
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version

      - name: Update version in tauri.conf.json
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '${{ steps.ver.outputs.version }}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag_name }}
          releaseName: 'WorkMami ${{ steps.ver.outputs.version }}'
          releaseBody: |
            **Channel**: ${{ steps.ver.outputs.channel }}
            **Version**: ${{ steps.ver.outputs.version }}

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: ${{ steps.ver.outputs.prerelease }}
          args: --target ${{ matrix.target }}
