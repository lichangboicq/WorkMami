name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - nightly
      - beta
      - stable

jobs:
  build:
    # 放行人工触发的分支/tag 发版；屏蔽 daily-release.yml 由机器人创建的 v* tag 回环触发
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      # fetch-depth: 0 保证能拉到全部 tag，nightly 自增计数依赖 tag 历史
      - name: Suppress git defaultBranch hint
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Determine version and channel
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 手动 tag 发版：tag 名即版本号
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ "${VERSION}" == *"-beta."* ]]; then
              CHANNEL="beta"
            elif [[ "${VERSION}" == *"-nightly."* ]]; then
              CHANNEL="nightly"
            else
              CHANNEL="stable"
            fi
          else
            # 分支发版：nightly / beta / stable 三渠道，版本号由 scripts/next-version.mjs 自动递增
            #   nightly: patch +0.0.1（满 10 进位 minor）  beta: minor +0.1.0  stable: major +1.0.0
            CHANNEL="${GITHUB_REF_NAME}"
            VERSION=$(node scripts/next-version.mjs "${CHANNEL}")
            TAG_NAME="v${VERSION}"
          fi
          # 含预发布分隔符 "-" 的一律标记为 prerelease
          if [[ "${VERSION}" == *"-"* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Channel: ${CHANNEL}, Version: ${VERSION}, Prerelease: ${PRERELEASE}"

      - name: Update version in package.json
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version

      - name: Update version in tauri.conf.json
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '${{ steps.ver.outputs.version }}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag_name }}
          releaseName: 'WorkMami ${{ steps.ver.outputs.version }}'
          releaseBody: |
            **Channel**: ${{ steps.ver.outputs.channel }}
            **Version**: ${{ steps.ver.outputs.version }}

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: ${{ steps.ver.outputs.prerelease }}
          args: --target ${{ matrix.target }}
